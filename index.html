<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shagun - Gift Stocks to Loved Ones</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; max-width: 450px; width: 100%; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { color: #1e3a8a; margin-top: 0; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { font-size: 14px; font-weight: 600; color: #374151; display: block; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
    button { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #1d4ed8; }
    #statusMessage { margin-top: 15px; text-align: center; font-weight: bold; word-break: break-all; }
  </style>
</head>
<body>

<div class="card">
  <h2>🎁 Send a Shagun (Stock Gift)</h2>
  <form id="giftForm">
    <div class="form-group">
      <label>Your Name (Sender)</label>
      <input type="text" id="senderName" placeholder="e.g. Ankit Kumar" required>
    </div>
    <div class="form-group">
      <label>Your Phone Number</label>
      <input type="tel" id="senderPhone" placeholder="+918828291234" required>
    </div>
    <div class="form-group">
      <label>Recipient Name</label>
      <input type="text" id="recipientName" placeholder="e.g. Payal" required>
    </div>
    <div class="form-group">
      <label>Recipient Phone Number</label>
      <input type="tel" id="recipientPhone" placeholder="+916290029033" required>
    </div>
    <div class="form-group">
      <label>Select Stock</label>
      <select id="stockSymbol" required>
        <option value="TATAMOTORS">Tata Motors</option>
        <option value="RELIANCE">Reliance Industries</option>
        <option value="INFY">Infosys</option>
        <option value="HDFCBANK">HDFC Bank</option>
      </select>
    </div>
    <div class="form-group">
      <label>Gift Amount (INR ₹)</label>
      <input type="number" id="amount" value="2100" min="500" required>
    </div>
    <div class="form-group">
      <label>Occasion</label>
      <select id="occasion">
        <option value="WEDDING">Shaadi / Wedding</option>
        <option value="BIRTHDAY">Birthday</option>
        <option value="DIWALI">Diwali</option>
        <option value="GENERAL">Best Wishes</option>
      </select>
    </div>
    <div class="form-group">
      <label>Personal Message</label>
      <textarea id="message" rows="2" placeholder="Wishing you a prosperous future!"></textarea>
    </div>
    <button type="submit" id="submitBtn">Pay & Send Stock Gift 🚀</button>
  </form>

  <div id="statusMessage"></div>
</div>

<script>
  const RENDER_API_URL = 'https://shagun-api.onrender.com';

  document.getElementById('giftForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('statusMessage');
    
    submitBtn.innerText = 'Creating Order...';
    submitBtn.disabled = true;
    statusDiv.style.color = '#374151';
    statusDiv.innerText = 'Connecting to Shagun backend...';

    const giftDetails = {
      sender_name: document.getElementById('senderName').value,
      sender_phone: document.getElementById('senderPhone').value,
      recipient_name: document.getElementById('recipientName').value,
      recipient_phone: document.getElementById('recipientPhone').value,
      stock_symbol: document.getElementById('stockSymbol').value,
      gift_amount_inr: parseFloat(document.getElementById('amount').value),
      occasion: document.getElementById('occasion').value,
      message: document.getElementById('message').value
    };

    try {
      // 1. Save draft order in Supabase via Render
      const giftRes = await fetch(`${RENDER_API_URL}/api/v1/gifts/create`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(giftDetails)
      });
      
      const rawText = await giftRes.text();
      let giftData;
      try {
        giftData = JSON.parse(rawText);
      } catch (err) {
        throw new Error('Backend returned invalid HTML instead of JSON: ' + rawText.substring(0, 100));
      }

      if (!giftData.success) throw new Error(giftData.error || 'Failed to create gift order');

      const createdGift = giftData.order;

      // 2. Create Razorpay Payment Order
      statusDiv.innerText = 'Initiating payment modal...';
      const payOrderRes = await fetch(`${RENDER_API_URL}/api/v1/payments/create-order`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          amount_inr: giftDetails.gift_amount_inr, 
          gift_id: createdGift.id 
        })
      });
      const payOrderData = await payOrderRes.json();
      if (!payOrderData.success) throw new Error('Razorpay setup failed: ' + payOrderData.error);

      // 3. Open Razorpay Checkout Modal
      const options = {
        key: payOrderData.key_id,
        amount: payOrderData.amount,
        currency: payOrderData.currency,
        name: 'Shagun Equity Gifting',
        description: `${giftDetails.stock_symbol} Gift for ${giftDetails.recipient_name}`,
        order_id: payOrderData.razorpay_order_id,
        prefill: {
          name: giftDetails.sender_name,
          contact: giftDetails.sender_phone
        },
        theme: { color: '#2563eb' },
        handler: async function (response) {
          statusDiv.innerText = 'Verifying payment status...';

          const verifyRes = await fetch(`${RENDER_API_URL}/api/v1/payments/verify`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              razorpay_order_id: response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature: response.razorpay_signature,
              gift_id: createdGift.id
            })
          });

          const verifyData = await verifyRes.json();

          if (verifyData.success) {
            statusDiv.style.color = '#16a34a';
            statusDiv.innerHTML = `🎉 Payment Successful!<br><br><a href="${giftData.claim_url}" target="_blank">View Lifafa Claim Link</a>`;
          } else {
            statusDiv.style.color = '#dc2626';
            statusDiv.innerText = 'Payment verification failed.';
          }
        }
      };

      const rzp = new Razorpay(options);
      rzp.open();

    } catch (err) {
      statusDiv.style.color = '#dc2626';
      statusDiv.innerText = 'Error: ' + err.message;
      console.error(err);
    } finally {
      submitBtn.innerText = 'Pay & Send Stock Gift 🚀';
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
