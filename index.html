<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shagun - Gift Stocks to Loved Ones 🎁</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; max-width: 480px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #1e3a8a; margin-top: 0; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; font-size: 14px; color: #374151; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
    textarea { resize: vertical; height: 80px; }
    .btn { background: #2563eb; color: white; border: none; padding: 14px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn:hover { background: #1d4ed8; }
    #statusMessage { margin-top: 15px; text-align: center; font-weight: bold; line-height: 1.6; }
    .wa-btn { background: #25D366; color: white; padding: 10px 18px; border-radius: 6px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 10px; }
    .claim-btn { background: #1e3a8a; color: white; padding: 10px 18px; border-radius: 6px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 10px; margin-right: 8px; }
  </style>
</head>
<body>

<div class="card">
  <h2>🎁 Send a Shagun (Stock Gift)</h2>
  
  <form id="giftForm">
    <div class="form-group">
      <label>Your Name (Sender)</label>
      <input type="text" id="senderName" required placeholder="e.g. Ankit Kumar">
    </div>

    <div class="form-group">
      <label>Your Phone Number</label>
      <input type="tel" id="senderPhone" required placeholder="e.g. 9876543210">
    </div>

    <div class="form-group">
      <label>Recipient Name</label>
      <input type="text" id="recipientName" required placeholder="e.g. Payal">
    </div>

    <div class="form-group">
      <label>Recipient Phone Number</label>
      <input type="tel" id="recipientPhone" required placeholder="e.g. 9123456789">
    </div>

    <div class="form-group">
      <label>Select Stock</label>
      <select id="stockSymbol" required>
        <option value="TATAMOTORS">Tata Motors</option>
        <option value="HDFCBANK">HDFC Bank</option>
        <option value="RELIANCE">Reliance Industries</option>
        <option value="INFY">Infosys</option>
        <option value="TCS">TCS</option>
      </select>
    </div>

    <div class="form-group">
      <label>Gift Amount (INR ₹)</label>
      <input type="number" id="giftAmount" min="100" required placeholder="2100">
    </div>

    <div class="form-group">
      <label>Occasion</label>
      <select id="occasion">
        <option value="WEDDING">Shaadi / Wedding</option>
        <option value="BIRTHDAY">Birthday</option>
        <option value="FESTIVAL">Diwali / Festival</option>
        <option value="ANNIVERSARY">Anniversary</option>
        <option value="OTHER">Congratulations</option>
      </select>
    </div>

    <div class="form-group">
      <label>Personal Message</label>
      <textarea id="message" placeholder="Wishing you a prosperous future!"></textarea>
    </div>

    <button type="submit" id="submitBtn" class="btn">Pay & Send Stock Gift 🚀</button>
  </form>

  <div id="statusMessage"></div>
</div>

<script>
  const API_BASE_URL = 'https://shagun-api.onrender.com';

  document.getElementById('giftForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('statusMessage');

    btn.disabled = true;
    btn.innerText = 'Creating order...';
    statusDiv.innerHTML = '';

    const payload = {
      sender_name: document.getElementById('senderName').value,
      sender_phone: document.getElementById('senderPhone').value,
      recipient_name: document.getElementById('recipientName').value,
      recipient_phone: document.getElementById('recipientPhone').value,
      stock_symbol: document.getElementById('stockSymbol').value,
      gift_amount_inr: parseFloat(document.getElementById('giftAmount').value),
      occasion: document.getElementById('occasion').value,
      message: document.getElementById('message').value
    };

    try {
      // Step 1: Create gift record in Supabase
      const giftRes = await fetch(`${API_BASE_URL}/api/v1/gifts/create`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const giftData = await giftRes.json();
      if (!giftData.success) throw new Error(giftData.error || 'Failed to create gift order');

      btn.innerText = 'Initiating payment modal...';

      // Step 2: Create Razorpay Payment Order
      const payRes = await fetch(`${API_BASE_URL}/api/v1/payments/create-order`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          amount_inr: payload.gift_amount_inr,
          gift_id: giftData.order.id
        })
      });

      const payData = await payRes.json();
      if (!payData.success) throw new Error(payData.error || 'Failed to create Razorpay payment order');

      // Step 3: Open Razorpay Modal
      const options = {
        key: payData.key_id,
        amount: payData.amount,
        currency: payData.currency,
        name: 'Shagun Equity Gifting',
        description: `Stock Gift of ${payload.stock_symbol}`,
        order_id: payData.razorpay_order_id,
        handler: async function (response) {
          btn.innerText = 'Verifying payment...';

          // Step 4: Verify Payment
          const verifyRes = await fetch(`${API_BASE_URL}/api/v1/payments/verify`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              razorpay_order_id: response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature: response.razorpay_signature,
              gift_id: giftData.order.id
            })
          });

          const verifyData = await verifyRes.json();

          if (verifyData.success) {
            btn.style.display = 'none';
            
            const shareText = encodeURIComponent(`Hi ${payload.recipient_name}! ${payload.sender_name} has sent you a stock gift of ${payload.stock_symbol} via Shagun 🎁. Claim it into your Demat account here: ${giftData.claim_url}`);
            const waUrl = `https://api.whatsapp.com/send?text=${shareText}`;

            statusDiv.innerHTML = `
              <span style="color:#16a34a; font-size:18px;">🎉 Payment Successful!</span><br><br>
              <a href="${giftData.claim_url}" target="_blank" class="claim-btn">View Claim Page 🎁</a>
              <a href="${waUrl}" target="_blank" class="wa-btn">Share via WhatsApp 💬</a>
            `;
          } else {
            throw new Error(verifyData.error || 'Payment verification failed');
          }
        },
        prefill: {
          name: payload.sender_name,
          contact: payload.sender_phone
        },
        theme: { color: '#2563eb' }
      };

      const rzp = new Razorpay(options);
      rzp.open();

    } catch (err) {
      statusDiv.style.color = '#dc2626';
      statusDiv.innerText = 'Error: ' + err.message;
      btn.disabled = false;
      btn.innerText = 'Pay & Send Stock Gift 🚀';
    }
  });
</script>

</body>
</html>
