<script>
// Live Render API URL
const RENDER_API_URL = 'https://shagun-api.onrender.com';

// Form submit function
async function createStockGift(giftDetails) {
  try {
    const response = await fetch(`${RENDER_API_URL}/api/v1/gifts/create`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        sender_phone: giftDetails.senderPhone,
        sender_name: giftDetails.senderName,
        recipient_phone: giftDetails.recipientPhone,
        recipient_name: giftDetails.recipientName,
        stock_symbol: giftDetails.stockSymbol,
        gift_amount_inr: giftDetails.amount,
        occasion: giftDetails.occasion,
        message: giftDetails.message
      })
    });

    const data = await response.json();

    if (data.success) {
      alert(`Gift Order Created! Claim Link: ${data.claim_url}`);
      console.log('Order Data:', data.order);
    } else {
      alert('Error: ' + data.error);
    }
  } catch (err) {
    console.error('Network Error:', err);
  }
}
</script>
